<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">An upload is not yet an admitted file</title>
  <desc id="desc">The server authorizes an upload URL. The browser PUTs bytes to staging. The provider promotes a confirmed file, then the application validates final metadata and commits the record. Unconfirmed staging expires only with cleanup configured.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#627d98"/></marker></defs>
  <rect width="800" height="450" rx="16" fill="#f4f7fb"/>
  <g font-family="system-ui, sans-serif" fill="#17324d">
    <text x="28" y="38" font-size="22" font-weight="700">Upload bytes first. Admit the file after validation.</text>
    <text x="28" y="65" font-size="14">Staged workflow · keep the same storage selection throughout</text>
    <g fill="#e2edf8" stroke="#b0c9e0"><rect x="28" y="95" width="216" height="84" rx="10"/><rect x="292" y="95" width="216" height="84" rx="10"/><rect x="556" y="95" width="216" height="84" rx="10"/></g>
    <text x="46" y="128" font-size="18" font-weight="700">1 · Authorize</text><text x="46" y="155" font-size="15">Server: CreateUploadUrl</text>
    <text x="310" y="128" font-size="18" font-weight="700">2 · Transfer bytes</text><text x="310" y="155" font-size="15">Browser: PUT + headers</text>
    <text x="574" y="128" font-size="18" font-weight="700">3 · Staged object</text><text x="574" y="155" font-size="15">__staging__/…</text>
    <path d="M244 137H280" stroke="#627d98" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M508 137H544" stroke="#627d98" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M664 179V239" stroke="#627d98" stroke-width="2" marker-end="url(#arrow)"/><text x="678" y="215" font-size="14">Confirm</text>
    <rect x="556" y="251" width="216" height="90" rx="10" fill="#17324d"/><text x="574" y="284" fill="#fff" font-size="18" font-weight="700">4 · PromoteFile</text><text x="574" y="310" fill="#d5e5f3" font-size="15">Complete final object</text><text x="574" y="330" fill="#d5e5f3" font-size="15">No overwrite</text>
    <path d="M556 296H520" stroke="#627d98" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="292" y="251" width="216" height="90" rx="10" fill="#e2f3ec" stroke="#91c7ae"/><text x="310" y="284" font-size="18" font-weight="700">5 · Admit</text><text x="310" y="310" font-size="15">Validate final metadata</text><text x="310" y="330" font-size="15">Commit business record</text>
    <path d="M556 165H536V210H136V239" fill="none" stroke="#b17a23" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <rect x="28" y="251" width="216" height="90" rx="10" fill="#fff0cf"/><text x="46" y="284" font-size="18" font-weight="700">Abandoned upload</text><text x="46" y="311" font-size="15">Expires only with backend</text><text x="46" y="331" font-size="15">cleanup configured</text>
    <text x="28" y="394" font-size="17" font-weight="600">Promotion publishes storage. Application admission authorizes use.</text>
    <text x="28" y="420" font-size="15">A final key alone is not ownership, cancellation protection, or permission to read.</text>
  </g>
</svg>
