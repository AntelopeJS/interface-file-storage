<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1010" viewBox="0 0 480 1010" role="img" aria-labelledby="title desc">
  <title id="title">An upload is not yet an admitted file</title>
  <desc id="desc">The server authorizes an upload URL. The browser PUTs bytes to staging. The provider promotes a confirmed file, then the application validates final metadata and commits the record. Unconfirmed staging expires only with cleanup configured.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#627d98"/></marker></defs>
  <rect width="480" height="1010" rx="16" fill="#f4f7fb"/>
  <g font-family="system-ui, sans-serif" fill="#17324d" font-size="18">
    <text x="24" y="36" font-size="24" font-weight="700">Upload, validate, then admit</text><text x="24" y="67">Keep the same storage throughout.</text>
    <g fill="#e2edf8" stroke="#b0c9e0"><rect x="24" y="94" width="400" height="80" rx="10"/><rect x="24" y="212" width="400" height="80" rx="10"/><rect x="24" y="330" width="400" height="80" rx="10"/></g>
    <text x="44" y="126" font-size="22" font-weight="700">1 · Authorize</text><text x="44" y="154">Server: CreateUploadUrl</text>
    <text x="44" y="244" font-size="22" font-weight="700">2 · Transfer bytes</text><text x="44" y="272">Browser: PUT + returned headers</text>
    <text x="44" y="362" font-size="22" font-weight="700">3 · Staged object</text><text x="44" y="390">__staging__/…</text>
    <path d="M224 174V200" stroke="#627d98" stroke-width="2" marker-end="url(#arrow)"/><path d="M224 292V318" stroke="#627d98" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M224 410V452" stroke="#627d98" stroke-width="2" marker-end="url(#arrow)"/><text x="242" y="438" font-size="16">Confirm</text>
    <rect x="24" y="464" width="400" height="90" rx="10" fill="#17324d"/><text x="44" y="497" fill="#fff" font-size="22" font-weight="700">4 · PromoteFile</text><text x="44" y="530" fill="#d5e5f3">Complete final object · no overwrite</text>
    <path d="M224 554V580" stroke="#627d98" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="24" y="592" width="400" height="112" rx="10" fill="#e2f3ec" stroke="#91c7ae"/><text x="44" y="625" font-size="22" font-weight="700">5 · Admit</text><text x="44" y="657">Validate final metadata</text><text x="44" y="684">Commit business record</text>
    <path d="M424 370H448V783H424" fill="none" stroke="#b17a23" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <rect x="24" y="734" width="400" height="112" rx="10" fill="#fff0cf"/><text x="44" y="767" font-size="22" font-weight="700">Abandoned upload</text><text x="44" y="799">Dashed path: expires only with</text><text x="44" y="826">backend cleanup configured</text>
    <text x="24" y="885" font-weight="600">Promotion publishes storage.</text><text x="24" y="914" font-weight="600">Application admission authorizes use.</text><text x="24" y="950" font-size="16">A final key alone is not ownership, cancellation</text><text x="24" y="977" font-size="16">protection, or permission to read.</text>
  </g>
</svg>
